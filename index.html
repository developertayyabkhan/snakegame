<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I AM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
        }

        .hero {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-wrap {
            font-size: clamp(3rem, 10vw, 8rem);
            color: #00ff00;
            text-align: center;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .prefix {
            font-size: clamp(3rem, 10vw, 8rem);
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        .typed-text {
            font-size: clamp(2rem, 7vw, 6rem);
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cursor {
            display: inline-block;
            width: 4px;
            height: 60px;
            background-color: #00ff00;
            margin-left: 10px;
            animation: blink 0.7s infinite;
            box-shadow: 0 0 10px #00ff00;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes glow {
            0%, 100% { 
                text-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5);
            }
            50% { 
                text-shadow: 0 0 20px #00ff00, 0 0 40px rgba(0, 255, 0, 0.8);
            }
        }

        @media (max-width: 768px) {
            .typing-wrap {
                gap: 15px;
            }

            .cursor {
                height: 40px;
                width: 3px;
            }
        }
    </style>
</head>
<body>
    <main class="hero">
        <div class="typing-wrap">
            <span class="prefix">I AM</span>
            <span class="typed-text" id="typedText"></span>
            <span class="cursor"></span>
        </div>
    </main>

    <script>
        const professions = [
            'Developer',
            'Designer',
            'YouTuber',
            'TikToker',
            'Frontend Developer'
        ];

        let currentProfession = 0;
        let currentChar = 0;
        let isDeleting = false;
        const typedText = document.getElementById('typedText');
        const typeSpeed = 100;
        const deleteSpeed = 50;
        const delayBetweenWords = 2000;

        function type() {
            const profession = professions[currentProfession];
            
            if (isDeleting) {
                typedText.textContent = profession.substring(0, currentChar - 1);
                currentChar--;

                if (currentChar === 0) {
                    isDeleting = false;
                    currentProfession = (currentProfession + 1) % professions.length;
                    setTimeout(type, 500);
                } else {
                    setTimeout(type, deleteSpeed);
                }
            } else {
                typedText.textContent = profession.substring(0, currentChar + 1);
                currentChar++;

                if (currentChar === profession.length) {
                    isDeleting = true;
                    setTimeout(type, delayBetweenWords);
                } else {
                    setTimeout(type, typeSpeed);
                }
            }
        }

        // Start typing animation
        type();
    </script>
</body>
</html>
